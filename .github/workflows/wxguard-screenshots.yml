name: WXGUARD PRO Demo Screenshots
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    if: github.repository == 'BaconDisk22/WXGUARD-PRO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser screenshot tool
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local demo server
        run: |
          python3 -m http.server 8765 --directory web > /tmp/wxguard-demo-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/demo.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p screenshots
          npx playwright screenshot --browser chromium --viewport-size '1440,1000' --wait-for-timeout 1200 --full-page http://127.0.0.1:8765/demo.html screenshots/wxguard-pro-desktop.png
          npx playwright screenshot --browser chromium --viewport-size '390,844' --wait-for-timeout 1200 --full-page http://127.0.0.1:8765/demo.html screenshots/wxguard-pro-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-demo-screenshots
          path: screenshots/*.png
          if-no-files-found: error
      - name: Commit screenshots for README on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/wxguard-pro-desktop.png screenshots/wxguard-pro-mobile.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh demo screenshots [skip ci]'
          git push origin HEAD:main
