name: WXGUARD PRO CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wxguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web tests and offline bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Run web tests
        run: npm test
      - name: Build single-file offline client
        run: |
          mkdir -p ../dist
          npm run single
      - name: Upload offline client
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-offline-web
          path: dist/*.html
          if-no-files-found: error
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,portal]'
      - name: Run Python tests
        run: python -m pytest -q

  mac-launcher:
    name: macOS launcher syntax and requirements
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test localhost web server
        run: |
          node web/tools/dev-server.mjs --port 18137 > /tmp/wxguard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 1 http://127.0.0.1:18137/ | grep -q 'WXGUARD PRO'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat /tmp/wxguard-server.log; exit 1; }
      - name: Verify launcher rejects occupied ports
        run: |
          node -e 'require("http").createServer((req,res)=>res.end("unrelated service")).listen(18138,"127.0.0.1")' &
          blocker_pid=$!
          trap 'kill "$blocker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18138/ >/dev/null; then break; fi
            sleep 1
          done
          if WXGUARD_PORT=18138 bash macos/Launch-WXGUARD-PRO.command > /tmp/wxguard-port.log 2>&1; then
            echo "Launcher incorrectly succeeded on occupied port"
            cat /tmp/wxguard-port.log
            exit 1
          fi
          grep -q 'already occupied' /tmp/wxguard-port.log
      - name: Validate shell launcher syntax
        run: bash -n macos/Launch-WXGUARD-PRO.command
      - name: Validate bundled launcher paths
        run: |
          test -f web/tools/dev-server.mjs
          test -f macos/README.md
          grep -q 'Node.js 22' macos/Launch-WXGUARD-PRO.command
          grep -q 'Chromium' macos/Launch-WXGUARD-PRO.command
  mac-app:
    name: macOS app bundle (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build WXGUARD PRO.app
        run: bash macos/build-app.sh
      - name: Smoke test the app's own server
        run: bash macos/smoke-test-app.sh
      - name: Upload macOS app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-macos-app
          path: |
            dist/macos/WXGUARD-PRO-macOS.zip
            dist/macos/WXGUARD-PRO-macOS.zip.sha256
          if-no-files-found: error
