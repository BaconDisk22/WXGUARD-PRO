name: WXGUARD PRO CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wxguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web tests and offline bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run web tests
        run: npm test
      - name: Build single-file offline client
        run: |
          mkdir -p ../dist
          npm run single
      - name: Upload offline client
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-offline-web
          path: dist/*.html
          if-no-files-found: error
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,portal]'
      - name: Run Python tests
        run: python -m pytest -q
