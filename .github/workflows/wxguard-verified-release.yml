name: WXGUARD PRO Verified Releases
on:
  push:
    branches: [main]
    tags: ['wxguard-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wxguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac-app:
    if: github.repository == 'TheLogsAreScreaming/WXGUARD-PRO'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and smoke test WXGUARD PRO.app
        run: |
          bash macos/build-app.sh
          bash macos/smoke-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-macos-app
          path: |
            dist/macos/WXGUARD-PRO-macOS.zip
            dist/macos/WXGUARD-PRO-macOS.zip.sha256
          if-no-files-found: error

  release:
    if: github.repository == 'TheLogsAreScreaming/WXGUARD-PRO'
    needs: mac-app
    runs-on: ubuntu-latest
    env:
      # Downloads live in a separate repo; source releases are no longer created here.
      RELEASES_REPO: TheLogsAreScreaming/WXGUARD-PRO-Releases
    steps:
      - name: Check release token
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/wxguard-v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=RELEASES_TOKEN missing::Set the RELEASES_TOKEN repository secret (fine-grained PAT with Contents: read and write on $RELEASES_REPO). Builds are published there, not in this repo."
            exit 1
          fi
          if ! gh api "repos/$RELEASES_REPO" --jq .full_name >/dev/null; then
            echo "::error title=RELEASES_TOKEN cannot reach $RELEASES_REPO::The token was rejected or has no access to $RELEASES_REPO. Regenerate it with that repository selected."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and package web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run single -- --out ../dist/WXGUARD-PRO.html
      - name: Test and package Python backend
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,portal]'
          python -m pytest -q
          python -m build
      - name: Fetch macOS app
        uses: actions/download-artifact@v4
        with:
          name: wxguard-pro-macos-app
          path: dist
      - name: Create downloadable browser ZIP
        run: |
          cd dist
          zip -j WXGUARD-PRO-offline-web.zip WXGUARD-PRO.html
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wxguard-pro-verified
          path: |
            dist/WXGUARD-PRO.html
            dist/WXGUARD-PRO-offline-web.zip
            dist/WXGUARD-PRO-macOS.zip
            dist/WXGUARD-PRO-macOS.zip.sha256
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Publish prerelease from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          short="${GITHUB_SHA:0:12}"
          tag="wxguard-dev-${short}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Automated development build of WXGUARD PRO from source commit [\`${short}\`](${commit_url}) on \`main\` ([build log](${run_url}))."
            echo
            echo "- **macOS app** (\`WXGUARD-PRO-macOS.zip\` + \`.sha256\`): Intel + Apple Silicon, needs Chrome/Edge/Brave/Chromium; ad-hoc signed, not notarized. See [macos/README.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/macos/README.md)."
            echo "- **Offline web client** (\`WXGUARD-PRO.html\`, \`WXGUARD-PRO-offline-web.zip\`): Chromium browsers."
            echo "- **Python packages** (wheel + sdist)."
            echo
            echo "Radio hardware compatibility has not been validated."
          } > release-notes.md
          gh release create "$tag" dist/WXGUARD-PRO.html dist/WXGUARD-PRO-offline-web.zip dist/WXGUARD-PRO-macOS.zip dist/WXGUARD-PRO-macOS.zip.sha256 dist/*.whl dist/*.tar.gz \
            -R "$RELEASES_REPO" \
            --title "WXGUARD PRO development ${short}" \
            --notes-file release-notes.md \
            --prerelease
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/wxguard-v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          short="${GITHUB_SHA:0:12}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          tag_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Verified automated build of WXGUARD PRO [\`${GITHUB_REF_NAME}\`](${tag_url}), source commit [\`${short}\`](${commit_url}) ([build log](${run_url}))."
            echo
            echo "- **macOS app** (\`WXGUARD-PRO-macOS.zip\` + \`.sha256\`): ad-hoc signed, not notarized."
            echo "- **Offline web client** (\`WXGUARD-PRO.html\`, \`WXGUARD-PRO-offline-web.zip\`)."
            echo "- **Python packages** (wheel + sdist)."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/WXGUARD-PRO.html dist/WXGUARD-PRO-offline-web.zip dist/WXGUARD-PRO-macOS.zip dist/WXGUARD-PRO-macOS.zip.sha256 dist/*.whl dist/*.tar.gz \
            -R "$RELEASES_REPO" \
            --title "WXGUARD PRO $GITHUB_REF_NAME" \
            --notes-file release-notes.md
