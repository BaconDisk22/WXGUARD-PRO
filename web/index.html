<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08131f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Severe weather alerts, current conditions and the forecast from a MeshCore weather radio, over Bluetooth or USB. No internet needed.">
  <title>WXGUARD PRO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/wxguard-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/place.css">
  <link rel="stylesheet" href="styles/radio.css">
</head>
<body>
  <div id="app" aria-live="off">
    <div class="boot" id="boot">
      <img class="boot__mark" src="assets/wxguard-icon.svg" alt="" width="72" height="72">
      <p class="boot__name">WXGUARD PRO</p>
      <p class="boot__status"><span class="spinner" aria-hidden="true"></span><span id="boot-status">Loading the weather tables…</span></p>
    </div>
  </div>
  <noscript>WXGUARD PRO needs JavaScript, and a Chromium browser for Bluetooth or USB.</noscript>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
